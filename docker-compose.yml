# Recommendarr — unified deployment
# Pull from Docker Hub or build locally
services:
  postgres:
    image: postgres:16-alpine
    container_name: Recommendarr-DB
    restart: unless-stopped
    environment:
      POSTGRES_DB: recommendarr
      POSTGRES_USER: recommendarr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recommendarr_dev}
    volumes:
      - ${POSTGRES_DATA:-./pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recommendarr"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m

  recommendarr:
    image: rayce185/recommendarr:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Recommendarr
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${RECOMMENDARR_PORT:-5055}:5055"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Europe/Zurich}
      - DATA_DIR=/app/data
      - DATABASE_URL=postgresql://recommendarr:${POSTGRES_PASSWORD:-recommendarr_dev}@Recommendarr-DB:5432/recommendarr
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5055/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "net.unraid.docker.managed=dockerman"
      - "net.unraid.docker.webui=http://[IP]:[PORT:${RECOMMENDARR_PORT:-5055}]/"
