<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 512 512">
  <defs>
    <filter id="sg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bg" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="le" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="rc"><circle cx="256" cy="256" r="224"/></clipPath>
    <radialGradient id="rbg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1a0a"/>
      <stop offset="85%" stop-color="#071407"/>
      <stop offset="100%" stop-color="#040c04"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" fill="#000"/>
  <!-- Bezel -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#1a5a1a" stroke-width="3"/>
  <!-- Cardinal ticks only -->
  <g stroke="#33ff33">
    <line x1="256" y1="16" x2="256" y2="34" stroke-width="3" opacity="0.7"/>
    <line x1="496" y1="256" x2="478" y2="256" stroke-width="3" opacity="0.7"/>
    <line x1="256" y1="496" x2="256" y2="478" stroke-width="3" opacity="0.7"/>
    <line x1="16" y1="256" x2="34" y2="256" stroke-width="3" opacity="0.7"/>
  </g>
  <g clip-path="url(#rc)">
    <circle cx="256" cy="256" r="224" fill="url(#rbg)"/>
    <!-- Chevron landmass -->
    <path d="M 173,90 L 268,90 L 375,256 L 268,422 L 174,422 L 280,256 Z" fill="#0d280d" opacity="0.9" filter="url(#le)"/>
    <path d="M 177,96 L 266,96 L 371,256 L 266,416 L 178,416 L 278,256 Z" fill="#143814" opacity="0.25"/>
    <!-- 3 rings (not 5) -->
    <circle cx="256" cy="256" r="75" fill="none" stroke="#1a5a1a" stroke-width="1" opacity="0.5"/>
    <circle cx="256" cy="256" r="150" fill="none" stroke="#1a5a1a" stroke-width="1" opacity="0.5"/>
    <circle cx="256" cy="256" r="224" fill="none" stroke="#1a5a1a" stroke-width="1" opacity="0.5"/>
    <!-- Crosshairs (no diagonals) -->
    <line x1="256" y1="32" x2="256" y2="480" stroke="#1a5a1a" stroke-width="1" opacity="0.4"/>
    <line x1="32" y1="256" x2="480" y2="256" stroke="#1a5a1a" stroke-width="1" opacity="0.4"/>
    <!-- Sweep beam -->
    <path d="M 256,256 L 375,65 A 224,224 0 0,0 315,38 Z" fill="#33ff33" opacity="0.14" filter="url(#sg)"/>
    <line x1="256" y1="256" x2="375" y2="65" stroke="#33ff33" stroke-width="2" opacity="0.75"/>
    <!-- Chevron overlay glow -->
    <path d="M 173,90 L 268,90 L 375,256 L 268,422 L 174,422 L 280,256 Z" fill="#33ff33" opacity="0.035"/>
    <!-- Blips as simple dots -->
    <circle cx="108" cy="145" r="6" fill="#33ff33" opacity="0.35" filter="url(#bg)"/>
    <circle cx="410" cy="155" r="5" fill="#33ff33" opacity="0.7" filter="url(#bg)"/>
    <circle cx="350" cy="100" r="6" fill="#33ff33" opacity="0.8" filter="url(#bg)"/>
    <circle cx="145" cy="415" r="4" fill="#33ff33" opacity="0.18" filter="url(#bg)"/>
    <circle cx="430" cy="310" r="5" fill="#33ff33" opacity="0.3" filter="url(#bg)"/>
    <circle cx="365" cy="415" r="5" fill="#33ff33" opacity="0.28" filter="url(#bg)"/>
    <circle cx="300" cy="68" r="4" fill="#33ff33" opacity="0.65" filter="url(#bg)"/>
    <circle cx="230" cy="445" r="3" fill="#33ff33" opacity="0.15"/>
    <circle cx="80" cy="275" r="4" fill="#33ff33" opacity="0.2" filter="url(#bg)"/>
  </g>
</svg>
