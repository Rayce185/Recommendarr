# Recommendarr v2 — unRAID deployment
# Backend API + Frontend UI
version: "3.8"

services:
  recommendarr:
    build:
      context: ./backend
      dockerfile: Dockerfile.v2
    container_name: recommendarr
    restart: unless-stopped
    ports:
      - "30800:30800"
    env_file:
      - .env
    environment:
      - TZ=Europe/Zurich
    volumes:
      - /mnt/user/system/appdata/recommendarr:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:30800/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    labels:
      - "net.unraid.docker.managed=dockerman"
      - "net.unraid.docker.webui=http://[IP]:[PORT:30800]/api/docs"

  recommendarr-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recommendarr-ui
    restart: unless-stopped
    ports:
      - "30801:80"
    depends_on:
      recommendarr:
        condition: service_healthy
    environment:
      - TZ=Europe/Zurich
    labels:
      - "net.unraid.docker.managed=dockerman"
      - "net.unraid.docker.webui=http://[IP]:[PORT:30801]/"
